<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="العملاء">
<title>نظام إدارة العملاء</title>
<style>
:root{--accent:#6d5efc;--accent2:#8b7fff;--on-accent:#fff;--bg:#0b0f1a;--surface:#131a2b;--surface2:#1a2338;--border:#27324f;--text:#e8ecf6;--muted:#97a3c0;--danger:#ef4444;--warn:#f59e0b;--ok-bg:rgba(34,197,94,.12);--ok-bd:#22c55e;--ok-tx:#4ade80;--err-bg:rgba(239,68,68,.12);--err-bd:#ef4444;--err-tx:#fca5a5;--shadow:0 10px 30px rgba(0,0,0,.35);--r:16px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#f3f5fb;--surface:#fff;--surface2:#f1f4fb;--border:#e1e6f2;--text:#18213a;--muted:#617089;--ok-bg:#e8f8ee;--ok-tx:#15803d;--err-bg:#fdecec;--err-tx:#b91c1c;--shadow:0 8px 24px rgba(30,50,100,.10);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:inherit}
body{font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans Arabic',Tahoma,sans-serif;background:radial-gradient(900px 420px at 100% -8%,color-mix(in srgb,var(--accent) 16%,transparent),transparent),var(--bg);background-attachment:fixed;color:var(--text);min-height:100vh;padding:1.25rem;line-height:1.5;transition:background .2s,color .2s}
.container{max-width:980px;margin:0 auto}
/* الشريط الجانبي */
.sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:270px;max-width:85vw;background:var(--surface);border-inline-end:1px solid var(--border);padding:1.1rem .9rem;padding-top:calc(1.1rem + env(safe-area-inset-top,0px));padding-bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.4rem;overflow-y:auto;z-index:40;box-shadow:var(--shadow);transition:transform .25s ease}
.side-brand{display:flex;align-items:center;gap:.7rem;padding:.4rem .5rem 1rem;border-bottom:1px solid var(--border);margin-bottom:.6rem}
.brand-logo{display:inline-grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);font-size:1.3rem}
.brand-name{font-weight:800;font-size:1.25rem;letter-spacing:.5px}
nav{display:flex;flex-direction:column;gap:.3rem}
.nav-btn{display:flex;align-items:center;gap:.7rem;width:100%;text-align:start;background:transparent;color:var(--muted);border:0;margin:0;padding:.75rem .9rem;font-weight:600;border-radius:12px}
.nav-btn:hover{background:var(--surface2);color:var(--text);filter:none}
.nav-btn.active,.nav-btn.active:hover{background:var(--accent);color:var(--on-accent)}
.side-bottom{margin-top:auto;display:flex;flex-direction:column;gap:.5rem;padding-top:1rem}
.user-box{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:.8rem;text-align:center}
.user-name{font-weight:700;word-break:break-word;margin-bottom:.35rem}
.role-badge{display:inline-block;font-size:.75rem;padding:.15rem .7rem;border-radius:999px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:700}
.sync-status{font-size:.75rem;color:var(--muted);margin-top:.35rem}
.topbar{display:none;position:sticky;top:0;z-index:30;align-items:center;gap:.7rem;padding:.7rem 1rem;margin:-1.25rem -1.25rem 1rem;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);font-weight:800}
.topbar-brand{display:flex;align-items:center;gap:.5rem}
.menu-btn{width:auto;margin:0;padding:.45rem .85rem;background:var(--surface2);color:var(--text);border:1px solid var(--border);font-size:1.1rem}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}
.scrim.on{display:block}
@media(min-width:901px){body{padding-inline-start:calc(270px + 1.5rem)}}
@media(max-width:900px){.topbar{display:flex}html[dir="rtl"] .sidebar{transform:translateX(105%)}html[dir="ltr"] .sidebar{transform:translateX(-105%)}.sidebar.open{transform:none !important}}
body.logged-out .sidebar,body.logged-out .topbar,body.logged-out .container,body.logged-out .scrim{display:none !important}
body.logged-out{padding-inline-start:1.25rem !important}
body:not(.is-manager) .manager-only{display:none !important}
/* تسجيل الدخول */
.login-screen{display:none;min-height:78vh;align-items:center;justify-content:center}
body.logged-out .login-screen{display:flex}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:2rem 1.6rem;width:100%;max-width:410px;box-shadow:var(--shadow)}
.login-logo{display:grid;width:4rem;height:4rem;font-size:2rem;margin:0 auto .6rem;border-radius:18px}
.login-name{text-align:center;font-size:1.6rem;font-weight:800;margin-bottom:1rem;letter-spacing:1px}
.login-box h2{text-align:center;font-size:1.1rem;margin-bottom:.3rem}
.login-box .sub{color:var(--muted);text-align:center;margin-bottom:1.2rem;font-size:.92rem}
/* الصفحات والكروت */
.page{display:none}
.page.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.3rem;box-shadow:var(--shadow);margin-bottom:1.1rem}
.card h2{font-size:1.1rem;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.card h2::before{content:"";width:5px;height:1.1em;border-radius:4px;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:.9rem;margin-bottom:1.1rem}
.stat-box{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,var(--surface)),var(--surface));border:1px solid var(--border);padding:1.1rem;border-radius:var(--r);text-align:center}
.stat-number{font-size:2rem;font-weight:800;color:var(--accent)}
.stat-label{color:var(--muted);font-size:.9rem}
#repStats{grid-template-columns:repeat(3,1fr);margin:0}
#repStats .stat-box{padding:.8rem .4rem}
#repStats .stat-label{font-size:.8rem}
.hero{text-align:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border-radius:22px;padding:2rem 1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.hero-icon{font-size:2.6rem}
.hero h2{font-size:1.6rem;margin:.3rem 0 .6rem}
.hero p{opacity:.92;line-height:1.9;max-width:560px;margin:0 auto 1.2rem}
.hero-btn{width:auto;margin:0;background:var(--on-accent);color:var(--accent);padding:.8rem 1.8rem}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.9rem;margin-bottom:1.1rem}
.feature{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.1rem;cursor:pointer;transition:transform .15s,border-color .15s}
.feature:hover,.feature:focus-visible{transform:translateY(-3px);border-color:var(--accent);outline:none}
.f-icon{font-size:1.7rem;margin-bottom:.4rem}
.feature h3{color:var(--accent);margin-bottom:.3rem;font-size:1rem}
.feature p{color:var(--muted);font-size:.88rem;line-height:1.7}
/* الفورم */
.form-group{margin-bottom:1rem}
label{display:block;margin-bottom:.4rem;color:var(--muted);font-weight:600;font-size:.9rem}
input,select{width:100%;padding:.8rem .9rem;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
input[readonly]{opacity:.7;border-style:dashed}
input[type=checkbox],input[type=radio]{width:auto}
input[type=color]{padding:.2rem;height:2.8rem;cursor:pointer}
button{font:inherit;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border:0;padding:.8rem 1.2rem;border-radius:12px;font-weight:700;cursor:pointer;width:100%;margin-top:.6rem;transition:filter .15s,transform .05s}
button:hover{filter:brightness(1.07)}
button:active{transform:scale(.98)}
button:disabled{opacity:.55;cursor:not-allowed}
.btn-gray{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-delete{background:var(--danger);color:#fff}
.btn-warn{background:var(--warn);color:#1f1300}
.seg-group{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.1rem}
.seg{flex:1;width:auto;margin:0;background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.seg.active,.seg.active:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.swatches{display:flex;gap:.55rem;flex-wrap:wrap;margin-bottom:.7rem}
.swatch{width:2.1rem;height:2.1rem;padding:0;margin:0;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--text)}
.switch-row{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;color:var(--text);cursor:pointer}
.radio-list{display:flex;flex-direction:column;gap:.5rem}
.radio-item{display:flex;align-items:center;gap:.7rem;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:.75rem .9rem;cursor:pointer;margin:0;color:var(--text);font-weight:600}
.radio-item input{width:auto;margin:0;accent-color:var(--accent)}
.radio-item:has(input:checked){background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
/* العملاء */
#customersList,#recentList,#accountsList{display:flex;flex-direction:column;gap:.7rem}
.cust,.customer-item{display:flex;align-items:center;gap:.8rem;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:.85rem}
.avatar{flex-shrink:0;width:2.8rem;height:2.8rem;border-radius:50%;display:grid;place-items:center;font-weight:800;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);font-size:1.1rem}
.cust-main,.customer-info{flex:1;min-width:0}
.cust-top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.cust-name,.customer-name{font-weight:700;word-break:break-word}
.cust-sub,.customer-phone{color:var(--muted);font-size:.92rem;text-align:start}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.35rem}
.chip{display:inline-block;font-size:.75rem;padding:.12rem .65rem;border-radius:999px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-weight:700}
.chip.code{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.cust-meta{color:var(--muted);font-size:.78rem;margin-top:.35rem;word-break:break-all}
.cust-actions{display:flex;gap:.4rem;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;max-width:9.5rem}
.cust-actions .manager-only{display:flex;gap:.4rem}
.ibtn{display:grid;place-items:center;width:2.3rem;height:2.3rem;padding:0;margin:0;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);text-decoration:none;font-size:1rem;cursor:pointer}
.ibtn.wa{background:#25d366;border-color:#25d366}
.ibtn.btn-delete{background:var(--danger);border-color:var(--danger)}
.acc-item{flex-wrap:wrap}
.acc-actions{display:flex;gap:.4rem;flex-wrap:wrap}
.acc-actions button{width:auto;margin:0;padding:.5rem .8rem;font-size:.85rem}
.filters{display:grid;grid-template-columns:1fr 170px;gap:.6rem;margin-bottom:1rem}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;flex-wrap:wrap;margin-bottom:.8rem}
.list-head h2{margin:0}
.list-head button{width:auto;margin:0;padding:.55rem 1rem;font-size:.85rem}
@media(max-width:520px){.filters{grid-template-columns:1fr}}
.no-customers{text-align:center;color:var(--muted);padding:1.6rem}
.success-message,.error-message{padding:.8rem 1rem;border-radius:12px;margin-bottom:1rem;text-align:center;font-weight:600}
.success-message{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok-tx)}
.error-message{background:var(--err-bg);border:1px solid var(--err-bd);color:var(--err-tx)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:1.2rem}
.modal[hidden]{display:none}
.modal-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.5rem;width:100%;max-width:400px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal-box h3{margin-bottom:.5rem}
.modal-box p{color:var(--muted);margin-bottom:1rem;font-size:.92rem;line-height:1.7}
.modal-actions{display:flex;gap:.6rem}
.modal-actions button{margin-top:.4rem}
.bar-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.65rem}
.bar-label{width:7rem;flex-shrink:0;font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:var(--surface2);border-radius:8px;height:.9rem;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:8px;min-width:2px}
.bar-val{width:4.6rem;flex-shrink:0;font-weight:700;text-align:end}
.bar-val small{color:var(--muted);font-weight:400}
.dev-footer{max-width:980px;margin:1.5rem auto 1rem;padding:1rem;border-top:1px solid var(--border);text-align:center;color:var(--muted);font-size:.85rem}
.dev-row{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-bottom:.4rem;align-items:center}
.dev-row i{opacity:.5;font-style:normal}
.dev-row a{color:var(--accent);text-decoration:none}
.powered b{color:var(--accent);letter-spacing:.5px}
</style>
</head>
<body class="logged-out">

<div class="topbar"><button type="button" class="menu-btn" id="sidebarToggle" aria-label="menu">☰</button><span class="topbar-brand"><span class="brand-logo" data-brand="logo"></span><span data-brand="name"></span></span></div>
<div class="scrim" id="scrim"></div>
<aside class="sidebar" id="sidebar">
  <div class="side-brand"><span class="brand-logo" data-brand="logo"></span><span class="brand-name" data-brand="name"></span></div>
  <nav>
    <button type="button" class="nav-btn active" data-page="home" data-i18n="navHome"></button>
    <button type="button" class="nav-btn" data-page="add" data-i18n="navAdd"></button>
    <button type="button" class="nav-btn" data-page="list" data-i18n="navList"></button>
    <button type="button" class="nav-btn manager-only" data-page="reports" data-i18n="navReports"></button>
    <button type="button" class="nav-btn manager-only" data-page="accounts" data-i18n="navAccounts"></button>
    <button type="button" class="nav-btn" data-page="settings" data-i18n="navSettings"></button>
  </nav>
  <div class="side-bottom">
    <div class="user-box"><div class="user-name" id="userName"></div><span class="role-badge" id="userRole"></span><div class="sync-status"></div></div>
    <button type="button" class="nav-btn" id="logoutBtn" data-i18n="logout"></button>
  </div>
</aside>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="brand-logo login-logo" data-brand="logo"></div>
    <div class="login-name" data-brand="name"></div>
    <h2 id="loginTitle"></h2>
    <p class="sub" id="loginSub"></p>
    <div class="sync-status" style="text-align:center;margin:0 0 12px"></div>
    <div class="error-message" id="loginError" hidden></div>
    <div class="form-group"><label for="loginUser" data-i18n="email"></label><input type="email" id="loginUser" autocomplete="username" dir="ltr"></div>
    <div class="form-group"><label for="loginPass" data-i18n="password"></label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <button type="button" id="loginBtn"></button>
    <button type="button" id="forgotBtn" class="btn-gray" data-i18n="forgot"></button>
  </div>
</div>

<div class="container">
  <div id="messageContainer"></div>

  <!-- الرئيسية -->
  <section class="page active" id="page-home">
    <div class="hero">
      <div class="hero-icon">👋</div>
      <h2 data-i18n="welcomeTitle"></h2>
      <p data-i18n="welcomeText"></p>
      <button type="button" class="hero-btn" data-go="add" data-i18n="startBtn"></button>
    </div>
    <div class="features">
      <div class="feature" data-go="add" role="button" tabindex="0"><div class="f-icon">➕</div><h3 data-i18n="featAddT"></h3><p data-i18n="featAddD"></p></div>
      <div class="feature" data-go="list" role="button" tabindex="0"><div class="f-icon">🔍</div><h3 data-i18n="featListT"></h3><p data-i18n="featListD"></p></div>
      <div class="feature" data-go="add" role="button" tabindex="0"><div class="f-icon">🔢</div><h3 data-i18n="featCodeT"></h3><p data-i18n="featCodeD"></p></div>
      <div class="feature" data-go="settings" role="button" tabindex="0"><div class="f-icon">🎨</div><h3 data-i18n="featSetT"></h3><p data-i18n="featSetD"></p></div>
    </div>
    <div class="stats">
      <div class="stat-box"><div class="stat-number" id="totalCustomers">0</div><div class="stat-label" data-i18n="total"></div></div>
      <div class="stat-box"><div class="stat-number" id="lastCode">-</div><div class="stat-label" data-i18n="lastCode"></div></div>
    </div>
    <div class="card"><h2 data-i18n="recentTitle"></h2><div id="recentList"></div></div>
  </section>

  <!-- تسجيل عميل جديد -->
  <section class="page" id="page-add">
    <div class="card">
      <h2 data-i18n="addTitle"></h2>
      <form id="addCustomerForm">
        <div class="form-group">
          <label for="customerCode" data-i18n="codeAuto"></label>
          <input type="text" id="customerCode" readonly>
        </div>
        <div class="form-group">
          <label for="customerName" data-i18n="name"></label>
          <input type="text" id="customerName" required maxlength="80" data-i18n-ph="namePh">
        </div>
        <div class="form-group">
          <label for="customerPhone" data-i18n="phone"></label>
          <input type="tel" id="customerPhone" required pattern="[0-9+\s\-]{7,15}" data-i18n-ph="phonePh" data-i18n-title="phoneTitle">
        </div>
        <div class="form-group"><label data-i18n="sourceLabel"></label><div class="radio-list" id="sourceList"></div></div>
        <button type="submit" data-i18n="addBtn"></button>
      </form>
    </div>
  </section>

  <!-- كل العملاء -->
  <section class="page" id="page-list">
    <div class="card">
      <div class="filters">
        <input type="search" id="listSearch" data-i18n-ph="searchAny">
        <select id="listSource"></select>
      </div>
      <div class="list-head">
        <h2><span data-i18n="listTitle"></span> <span id="listCount"></span></h2>
        <button type="button" id="exportBtn" class="btn-gray manager-only" data-i18n="exportBtn"></button>
      </div>
      <div id="customersList"></div>
    </div>
  </section>

  <!-- التقارير -->
  <section class="page manager-only" id="page-reports">
    <div class="card">
      <h2 data-i18n="repTitle"></h2>
      <div class="seg-group">
        <button type="button" class="seg" data-period="today" data-i18n="perToday"></button>
        <button type="button" class="seg active" data-period="7" data-i18n="per7"></button>
        <button type="button" class="seg" data-period="30" data-i18n="per30"></button>
        <button type="button" class="seg" data-period="all" data-i18n="perAll"></button>
      </div>
      <div class="stats" id="repStats"></div>
    </div>
    <div class="card"><h2 data-i18n="repBySource"></h2><div id="repSources"></div></div>
    <div class="card"><h2 data-i18n="repByEmp"></h2><div id="repEmployees"></div></div>
    <div class="card" id="repDaysCard"><h2 data-i18n="repByDay"></h2><div id="repDays"></div></div>
  </section>

  <!-- الحسابات -->
  <section class="page manager-only" id="page-accounts">
    <div class="card">
      <h2 data-i18n="accTitle"></h2>
      <form id="addAccountForm">
        <div class="form-group"><label for="accName" data-i18n="accName"></label><input type="text" id="accName" required maxlength="50" autocomplete="off"></div>
        <div class="form-group"><label for="accEmail" data-i18n="email"></label><input type="email" id="accEmail" required autocomplete="off" dir="ltr"></div>
        <div class="form-group"><label for="accPass" data-i18n="password"></label><input type="password" id="accPass" required minlength="6" autocomplete="new-password"></div>
        <div class="form-group"><label for="accRole" data-i18n="role"></label><select id="accRole"><option value="employee" data-i18n="roleEmployee"></option><option value="manager" data-i18n="roleManager"></option></select></div>
        <button type="submit" data-i18n="accAdd"></button>
      </form>
    </div>
    <div class="card">
      <h2 data-i18n="accList"></h2>
      <div id="accountsList"></div>
    </div>
  </section>

  <!-- الإعدادات -->
  <section class="page" id="page-settings">
    <div class="card">
      <h2 data-i18n="setAppearance"></h2>
      <label data-i18n="theme"></label>

  $('totalCustomers').textContent = customers.length;
  $('lastCode').textContent = last > 0 ? last : '-';
  $('customerCode').value = last + 1;
  const sorted = [...customers].sort((a, b) => Number(b.code) - Number(a.code));
  const raw = listQuery.trim();
  const q = normName(raw);
  const qd = normPhone(raw);
  const shown = sorted.filter(c => {
    if (listSource && c.source !== listSource) return false;
    if (!raw) return true;
    return String(c.code) === raw.replace(/^#/, '') || normName(c.name).includes(q) ||
      (qd.length >= 4 && normPhone(c.phone).includes(qd)) || (raw.replace(/\D/g, '').length >= 4 && String(c.phone).includes(raw));
  });
  $('listCount').textContent = '(' + (shown.length === customers.length ? customers.length : shown.length + '/' + customers.length) + ')';
  $('customersList').innerHTML = shown.length === 0 ? '<div class="no-customers">' + t('empty') + '</div>' : shown.map(c => customerHTML(c, true)).join('');

let reportPeriod = '7';
function barRows(items, total) {
  if (!items.length) return '<div class="no-customers">' + t('noData') + '</div>';
  const max = Math.max(1, ...items.map(i => i.count));
  return items.map(i => '<div class="bar-row"><div class="bar-label">' + esc(i.label) + '</div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' + (i.count / max * 100) + '%"></div></div>' +
    '<div class="bar-val">' + i.count + (total ? ' <small>(' + Math.round(i.count / total * 100) + '%)</small>' : '') + '</div></div>').join('');
}
function renderReports() {
  if (currentPage !== 'reports' || !isManager()) return;
  const keyOf = iso => fmtDate(iso).slice(0, 10);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const todayKey = keyOf(today.toISOString());
  let from = null;
  if (reportPeriod === 'today') from = today;
  else if (reportPeriod === '7' || reportPeriod === '30') { from = new Date(today); from.setDate(from.getDate() - (reportPeriod === '7' ? 6 : 29)); }
  const list = customers.filter(c => {
    if (!from) return true;
    const d = c.createdAt ? new Date(c.createdAt) : null;
    return !!d && !isNaN(d) && d >= from;
  });
  const todayCount = customers.filter(c => c.createdAt && keyOf(c.createdAt) === todayKey).length;
  const box = (n, label) => '<div class="stat-box"><div class="stat-number">' + n + '</div><div class="stat-label">' + label + '</div></div>';
  $('repStats').innerHTML = box(list.length, t('repPeriodTotal')) + box(todayCount, t('repToday')) + box(customers.length, t('repAllTotal'));

  const sc = {};
  list.forEach(c => { const k = SOURCES.some(s => s.k === c.source) ? c.source : 'other'; sc[k] = (sc[k] || 0) + 1; });
  const srcItems = SOURCES.map(s => ({ label: t(s.i), count: sc[s.k] || 0 }))
    .concat(sc.other ? [{ label: t('unknown'), count: sc.other }] : [])
    .sort((a, b) => b.count - a.count);
  $('repSources').innerHTML = barRows(srcItems, list.length);

  const ec = {};
  list.forEach(c => { const k = c.createdByEmail || c.createdBy || t('unknown'); ec[k] = (ec[k] || 0) + 1; });
  const empItems = Object.keys(ec).map(k => ({ label: k, count: ec[k] })).sort((a, b) => b.count - a.count);
  $('repEmployees').innerHTML = barRows(empItems, list.length);

  $('repDaysCard').hidden = reportPeriod === 'today';
  const n = reportPeriod === '7' ? 7 : 30;
  const dc = {};
  customers.forEach(c => { if (c.createdAt) { const k = keyOf(c.createdAt); dc[k] = (dc[k] || 0) + 1; } });
  const dayItems = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const k = keyOf(d.toISOString());
    dayItems.push({ label: k.slice(5), count: dc[k] || 0 });
  }
  $('repDays').innerHTML = barRows(dayItems, 0);
}

function hexRgb(h) {
  const m = /^#?([0-9a-f]{6})$/i.exec(h || '');
  if (!m) return null;
  const n = parseInt(m[1], 16);
  return [n >> 16, (n >> 8) & 255, n & 255];
}
function escA(x) { return esc(x).replace(/"/g, '&quot;'); }
function applyBrand() {
  const rgb = hexRgb(brand.accent) || hexRgb(DEFAULT_BRAND.accent);
  const lum = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
  const light = rgb.map(v => Math.min(255, Math.round(v + (255 - v) * 0.22)));
  const st = document.documentElement.style;
  st.setProperty('--accent', 'rgb(' + rgb.join(',') + ')');
  st.setProperty('--accent2', 'rgb(' + light.join(',') + ')');
  st.setProperty('--on-accent', lum > 0.6 ? '#111827' : '#ffffff');
  document.querySelectorAll('[data-brand="name"]').forEach(el => { el.textContent = brand.appName; });
  document.querySelectorAll('[data-brand="logo"]').forEach(el => { el.textContent = brand.logo; });

  document.title = brand.appName;

  const parts = [];
  if (brand.devName) parts.push('<span>' + t('devBy') + ': <b>' + esc(brand.devName) + '</b></span>');
  if (brand.devEmail) parts.push('<a href="mailto:' + escA(brand.devEmail) + '" dir="ltr">✉️ ' + esc(brand.devEmail) + '</a>');
  $('devFooter').innerHTML = (parts.length ? '<div class="dev-row">' + parts.join('<i>•</i>') + '</div>' : '') +
    (brand.poweredBy ? '<div class="powered">Powered by <b>' + esc(brand.poweredBy) + '</b></div>' : '');

async function submitPw() {

// كود متسلسل مضمون حتى لو أكتر من موظف بيضيف في نفس اللحظة (Transaction)
async function addCustomer(name, phone, source) {
  const cRef = doc(db, 'meta', 'counter');
  const createdAt = new Date().toISOString();
  const createdBy = (me && (me.name || me.email)) || '';
  const createdByEmail = (me && me.email) || '';
  return runTransaction(db, async tx => {
    const snap = await tx.get(cRef);
    const next = (snap.exists() ? Number(snap.data().value) || 0 : 0) + 1;
    const rec = { code: next, name: name, phone: phone, source: source, createdAt: createdAt, createdBy: createdBy, createdByEmail: createdByEmail };
    tx.set(cRef, { value: next });
    tx.set(doc(db, 'customers', String(next)), rec);
    return rec;
  });
}

/* ---------- منع التكرار ---------- */
function normName(s) {
  return String(s || '').toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/\s+/g, ' ').trim();
}
function normPhone(s) {
  let d = String(s || '').replace(/[٠-٩]/g, x => '٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g, '');
  if (d.startsWith('0020')) d = d.slice(4);
  else if (d.startsWith('20') && d.length >= 12) d = d.slice(2);
  if (d.length === 10 && d[0] !== '0') d = '0' + d;
  return d;
}
function findDuplicates(name, phone) {
  const n = normName(name);
  const p = normPhone(phone);
  const out = [];
  customers.forEach(c => {
    const nameMatch = !!n && normName(c.name) === n;
    const phoneMatch = !!p && normPhone(c.phone) === p;
    if (nameMatch || phoneMatch) out.push({ c: c, nameMatch: nameMatch, phoneMatch: phoneMatch });
  });
  return out.slice(0, 5);
}

function sheetPost(rows) {

  } catch (e) {}
}
function sortedCustomers() { return [...customers].sort((a, b) => Number(a.code) - Number(b.code)); }
function exportExcel() {
  const head = [t('colCode'), t('colName'), t('colPhone'), t('colSource'), t('colDate'), t('colBy'), t('colEmail')];
  const data = [head].concat(sortedCustomers().map(c => [c.code, c.name, c.phone, srcLabel(c.source), c.createdAt ? fmtDate(c.createdAt) : '', c.createdBy || '', c.createdByEmail || '']));
  if (window.XLSX) {
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{ wch: 8 }, { wch: 28 }, { wch: 16 }, { wch: 18 }, { wch: 18 }, { wch: 18 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Customers');
    XLSX.writeFile(wb, 'customers.xlsx');
  } else {
    const csv = '\ufeff' + data.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'customers.csv';
    a.click();
  }
  showMessage(t('msgExported'), 'success');
}

async function editCustomer(code) {
  const c = customers.find(x => Number(x.code) === code);
  if (!c) return;
  const r = await openFormModal({
    title: t('editCustTitle'), l1: t('name'), v1: c.name, l2: t('phone'), v2: c.phone, type2: 'tel',
    validate: (a, b) => (!a || !/^[0-9+ -]{7,15}$/.test(b.trim())) ? t('msgFill') : ''
  });
  if (!r) return;
  try {
    await updateDoc(doc(db, 'customers', String(code)), { name: r.v1, phone: r.v2.trim() });
    showMessage(t('msgCustUpdated'), 'success');
  } catch (e) { showMessage(t('msgSyncFail'), 'error'); }
}

async function renumber() {
  const sorted = [...customers].sort((a, b) => Number(a.code) - Number(b.code));
  const ops = [];
  const keep = new Set();
  sorted.forEach((c, i) => {
    const code = i + 1;
    keep.add(String(code));
    ops.push(b => b.set(doc(db, 'customers', String(code)), { code: code, name: c.name, phone: c.phone }));
  });
  customers.forEach(c => {
    const k = String(c.code);
    if (!keep.has(k)) ops.push(b => b.delete(doc(db, 'customers', k)));
  });
  ops.push(b => b.set(doc(db, 'meta', 'counter'), { value: sorted.length }));
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db);
    ops.slice(i, i + 400).forEach(f => f(b));
    await b.commit();
  }
  return sorted.length;
}

/* ---------- الاشتراك في البيانات الحية ---------- */
function stopAll() {
  unsubs.forEach(u => u());
  unsubs = [];
  if (unsubMe) { unsubMe(); unsubMe = null; }
  customers = []; users = []; counter = 0; me = null;
}
function startUsers() {
  unsubs.push(onSnapshot(collection(db, 'users'), s => {
    users = s.docs.map(d => ({ uid: d.id, ...d.data() }));
    renderAccounts();
  }, () => {}));
}
function startData() {
  unsubs.push(onSnapshot(collection(db, 'customers'), s => {
    customers = s.docs.map(d => ({ ...d.data() }));
    refresh();
  }, () => {}));
  unsubs.push(onSnapshot(doc(db, 'meta', 'counter'), s => {
    counter = s.exists() ? (Number(s.data().value) || 0) : 0;
    refresh();
  }, () => {}));
  unsubs.push(onSnapshot(doc(db, 'meta', 'settings'), s => {
    const d = s.exists() ? s.data() : {};
    sheetUrl = d.sheetUrl || '';
    prefs = { countryCode: String(d.countryCode || '20'), dupCheck: d.dupCheck !== false };
    const el = $('sheetUrl');
    if (document.activeElement !== el) el.value = sheetUrl;
    const cc = $('countryIn');
    if (document.activeElement !== cc) cc.value = prefs.countryCode;
    $('dupCheckIn').checked = prefs.dupCheck;
    refresh();
  }, () => {}));
  if (isManager()) startUsers();
}

function watchAuth() {
  onAuthStateChanged(auth, user => {
    stopAll();
    if (!user) { ready = true; applySession(); return; }
    unsubMe = onSnapshot(doc(db, 'users', user.uid), snap => {
      ready = true;
      if (!snap.exists()) {
        if (!bootstrapping) { loginNote(t('accDeleted')); signOut(auth); }
        return;
      }
      const d = snap.data();
      if (d.active !== true) { loginNote(t('errDisabled')); signOut(auth); return; }
      const first = !me;
      const wasManager = isManager();
      me = { uid: user.uid, ...d };
      if (first) startData();
      else if (isManager() && !wasManager) startUsers();
      applySession();
    }, () => { ready = true; applySession(); });
  });
}

/* ---------- تسجيل الدخول ---------- */
async function doLogin() {
  const email = $('loginUser').value.trim();
  const pass = $('loginPass').value;
  loginNote('');
  if (!email || pass.length < 6) { loginNote(t('msgFillAcc')); return; }
  $('loginBtn').disabled = true;
  try {
    if (setupDone === false) {
      bootstrapping = true;
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      try {
        const b = writeBatch(db);
        b.set(doc(db, 'users', cred.user.uid), { name: email.split('@')[0], email: email, role: 'manager', active: true });
        b.set(doc(db, 'meta', 'setup'), { done: true, by: cred.user.uid });
        await b.commit();
        setupDone = true;
      } catch (e2) {
        try { await cred.user.delete(); } catch (e3) {}
        throw e2;
      }
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
    $('loginPass').value = '';
  } catch (e) { loginNote(authMsg(e)); }
  bootstrapping = false;
  $('loginBtn').disabled = !ready;
}

$('addCustomerForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const name = $('customerName').value.trim();
  const phone = $('customerPhone').value.trim();
  if (!name || !phone) { showMessage(t('msgFill'), 'error'); return; }
  const form = this;
  const picked = form.querySelector('input[name="source"]:checked');
  if (!picked) { showMessage(t('msgPickSource'), 'error'); return; }
  const matches = prefs.dupCheck ? findDuplicates(name, phone) : [];
  if (matches.length && !(await confirmDup(matches))) return;
  try {
    const rec = await addCustomer(name, phone, picked.value);
    sheetPost([sheetRow(rec)]);
    form.reset();
    showMessage(t('msgAdded').replace('{n}', rec.code), 'success');
  } catch (err) { showMessage(t('msgSyncFail'), 'error'); }
});

$('dupAdd').addEventListener('click', () => closeDup(true));

$('exportBtn').addEventListener('click', exportExcel);
$('listSearch').addEventListener('input', e => { listQuery = e.target.value; refresh(); });

  };
  try { await setDoc(doc(db, 'meta', 'branding'), data); showMessage(t('msgBrandSaved'), 'success'); }

});
document.querySelectorAll('[data-period]').forEach(b => b.addEventListener('click', () => {
  reportPeriod = b.dataset.period;

  renderReports();
}));
$('sheetSave').addEventListener('click', async () => {
  if (!isManager()) return;
  try {
    await setDoc(doc(db, 'meta', 'settings'), {
      sheetUrl: $('sheetUrl').value.trim(),
      countryCode: $('countryIn').value.replace(/\D/g, '') || '20',
      dupCheck: $('dupCheckIn').checked
    });
    showMessage(t('msgPrefsSaved'), 'success');

});
$('sheetSendAll').addEventListener('click', () => {
  if (!isManager()) return;
  if (!sheetUrl) { showMessage(t('msgSheetNone'), 'error'); return; }
  const rows = sortedCustomers().map(sheetRow);
  sheetPost(rows);
  showMessage(t('msgSheetSent').replace('{n}', rows.length), 'success');
});

$('customersList').addEventListener('click', async function (e) {
  if (!isManager()) return;
  const ed = e.target.closest('.btn-edit');
  if (ed) { editCustomer(Number(ed.dataset.code)); return; }
  const btn = e.target.closest('.btn-delete');
  if (!btn) return;
  const code = String(Number(btn.dataset.code));
  if (!(await requirePassword())) return;
  try {
    await deleteDoc(doc(db, 'customers', code));
    showMessage(t('msgDeleted'), 'success');
  } catch (err) { showMessage(t('msgSyncFail'), 'error'); }
});

$('resetBtn').addEventListener('click', async function () {
  if (!isManager() || !(await requirePassword())) return;
  try {
    const n = await renumber();
    showMessage(t('msgReset').replace('{n}', n + 1), 'success');
  } catch (err) { showMessage(t('msgSyncFail'), 'error'); }
});


/* ---------- الحسابات (للمدير) ---------- */
$('addAccountForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  if (!isManager()) return;
  const form = this;
  const name = $('accName').value.trim();
  const email = $('accEmail').value.trim();
  const pass = $('accPass').value;
  const role = $('accRole').value === 'manager' ? 'manager' : 'employee';
  if (!name || !email || pass.length < 6) { showMessage(t('msgFillAcc'), 'error'); return; }
  // نستخدم نسخة تانية من Firebase عشان إنشاء الحساب ميسجّلش خروج المدير
  const sec = initializeApp(firebaseConfig, 'sec' + Date.now());
  let created = null;
  try {
    created = await createUserWithEmailAndPassword(getAuth(sec), email, pass);
    await setDoc(doc(db, 'users', created.user.uid), { name: name, email: email, role: role, active: true });
    form.reset();
    showMessage(t('msgAccAdded'), 'success');
  } catch (err) {
    if (created) { try { await created.user.delete(); } catch (e2) {} }
    showMessage(authMsg(err), 'error');
  } finally {
    try { await signOut(getAuth(sec)); } catch (e3) {}
    try { await deleteApp(sec); } catch (e4) {}
  }
});

$('accountsList').addEventListener('click', async function (e) {
  if (!isManager()) return;
  const b = e.target.closest('button[data-uid]');
  if (!b) return;
  const acc = users.find(u => u.uid === b.dataset.uid);
  if (!acc) return;
  const act = b.dataset.act;
  try {
    if (act === 'toggle' && acc.uid !== me.uid) {
      await updateDoc(doc(db, 'users', acc.uid), { active: !acc.active });
      showMessage(t('msgAccUpdated'), 'success');
    } else if (act === 'del' && acc.uid !== me.uid) {
      if (!(await requirePassword())) return;
      await deleteDoc(doc(db, 'users', acc.uid));
      showMessage(t('msgAccDeleted'), 'success');
    } else if (act === 'mail') {
      await sendPasswordResetEmail(auth, acc.email);
      showMessage(t('msgResetMail').replace('{e}', acc.email), 'success');
    } else if (act === 'edit') {
      const r = await openFormModal({
        title: t('editAccTitle'), l1: t('accName'), v1: acc.name || '', single: true,
        validate: v => v ? '' : t('msgFillAcc')
      });
      if (!r) return;
      await updateDoc(doc(db, 'users', acc.uid), { name: r.v1 });
      showMessage(t('msgAccUpdated'), 'success');
    }
  } catch (err) { showMessage(authMsg(err), 'error'); }
});

/* ---------- التشغيل ---------- */
async function init() {
  applyTheme();
  applyFont();
  fillBrandForm();
  applyLang();
  if (!CONFIGURED) return;
  try {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
  } catch (e) { return; }
  onSnapshot(doc(db, 'meta', 'branding'), s => {
    if (s.exists()) { brand = { ...DEFAULT_BRAND, ...s.data() }; store.set('brand', JSON.stringify(brand)); }
    applyBrand();
    fillBrandForm();
  }, () => {});
  try { setupDone = (await getDoc(doc(db, 'meta', 'setup'))).exists(); } catch (e) { setupDone = true; }
  watchAuth();
}
init();
