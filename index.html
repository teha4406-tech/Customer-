<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="العملاء">
<title>نظام إدارة العملاء</title>
<style>
:root{
  --bg:#1a1a1a;--card:#2d2d2d;--input:#1a1a1a;--accent:#00a8ff;--accent2:#00d4ff;--on-accent:#1a1a1a;
  --text:#e0e0e0;--muted:#b0b0b0;--danger:#ff4444;--glow:0 0 20px rgba(0,168,255,.2);
  --ok-bg:#1a3a1a;--ok-bd:#00aa00;--ok-tx:#00dd00;--err-bg:#3a1a1a;--err-bd:#aa0000;--err-tx:#ff6666;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#eef2f7;--card:#ffffff;--input:#f6f8fb;--accent:#0077cc;--accent2:#0094ff;--on-accent:#ffffff;
  --text:#1f2933;--muted:#5b6770;--danger:#d32f2f;--glow:0 2px 14px rgba(0,60,120,.12);
  --ok-bg:#e6f6e6;--ok-bd:#2e9e2e;--ok-tx:#1b6e1b;--err-bg:#fdeaea;--err-bd:#d32f2f;--err-tx:#a31515;
  color-scheme:light;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{margin:0;padding:0;box-sizing:inherit}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;padding:20px;min-height:100vh;transition:background .2s,color .2s}
.container{max-width:1000px;margin:0 auto}
header{text-align:center;margin-bottom:25px;border-bottom:2px solid var(--accent);padding-bottom:18px}
h1{color:var(--accent);font-size:2.1em}

/* الشريط الجانبي */
.sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:250px;max-width:85vw;background:var(--card);border-inline-end:2px solid var(--accent);padding:20px 14px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto;z-index:20;box-shadow:var(--glow);transition:transform .25s ease}
.brand{text-align:center;font-size:2.2em;margin-bottom:18px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:transparent;color:var(--text);border:2px solid transparent;margin:0 0 8px;padding:12px 14px;font-weight:600;border-radius:8px}
.nav-btn:hover{background:var(--input)}
.nav-btn.active,.nav-btn.active:hover{background:var(--accent);color:var(--on-accent)}
.sidebar-toggle{display:none;position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto;margin:0;padding:12px 18px;border-radius:50px;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.45)}
@media(min-width:901px){body{padding-inline-start:270px}}
@media(max-width:900px){
  html[dir="rtl"] .sidebar{transform:translateX(100%)}
  html[dir="ltr"] .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none !important}
  .sidebar-toggle{display:block}
}

/* الصفحات */
.page{display:none}
.page.active{display:block}
.hero{text-align:center;background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:40px 22px;box-shadow:var(--glow);margin-bottom:25px}
body.logged-out .sidebar,body.logged-out .sidebar-toggle,body.logged-out .container{display:none}
body.logged-out{padding-inline-start:20px !important}
.login-screen{display:none;min-height:80vh;align-items:center;justify-content:center}
body.logged-out .login-screen{display:flex}
.login-box{background:var(--card);border:2px solid var(--accent);border-radius:14px;padding:30px;width:100%;max-width:400px;box-shadow:var(--glow)}
.login-box h2{color:var(--accent);text-align:center;margin-bottom:6px}
.login-box .sub{color:var(--muted);text-align:center;margin-bottom:20px;line-height:1.7}
.user-box{background:var(--input);border-radius:8px;padding:10px 12px;margin-bottom:14px;text-align:center}
.user-name{font-weight:700;word-break:break-word;margin-bottom:4px}
.role-badge{display:inline-block;font-size:.8em;padding:2px 10px;border-radius:20px;background:var(--accent);color:var(--on-accent)}
body:not(.is-manager) .manager-only{display:none !important}
#accountsList{display:flex;flex-direction:column;gap:12px}
.acc-item{flex-wrap:wrap}
.acc-actions{display:flex;gap:8px;flex-wrap:wrap}
.acc-actions button,.btn-edit{width:auto;margin:0;padding:9px 14px;font-size:.9em}
.btn-warn{background:#d98200;color:#fff}
.btn-warn:hover{background:#f09a10}
.sync-status{font-size:.8em;color:var(--muted);margin-top:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal[hidden]{display:none}
.modal-box{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:24px;width:100%;max-width:380px;box-shadow:var(--glow)}
.modal-box h3{color:var(--accent);margin-bottom:8px}
.modal-box p{color:var(--muted);margin-bottom:16px;font-size:.95em;line-height:1.7}
.modal-actions{display:flex;gap:10px}
.modal-actions button{margin-top:6px}
.hero-icon{font-size:3.5em;margin-bottom:10px}
.hero h2{color:var(--accent);font-size:1.9em;margin-bottom:12px}
.hero p{color:var(--muted);line-height:1.9;max-width:600px;margin:0 auto 22px}
.hero-btn{width:auto;padding:14px 36px;margin:0;font-size:1.05em}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-bottom:25px}
.feature{background:var(--card);border:2px solid var(--accent);border-radius:10px;padding:20px;cursor:pointer;transition:transform .15s}
.feature:hover,.feature:focus-visible{transform:translateY(-3px);border-color:var(--accent2);outline:none}
.f-icon{font-size:2em;margin-bottom:8px}
.feature h3{color:var(--accent);margin-bottom:6px}
.feature p{color:var(--muted);line-height:1.7;font-size:.95em}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:25px}
.stat-box{background:var(--card);border:2px solid var(--accent);padding:18px;border-radius:8px;text-align:center}
.stat-number{font-size:2em;color:var(--accent);font-weight:700}
.stat-label{color:var(--muted)}
.card{background:var(--card);border:2px solid var(--accent);border-radius:10px;padding:22px;box-shadow:var(--glow);margin-bottom:25px}
.card h2{color:var(--accent);margin-bottom:18px;font-size:1.4em;border-bottom:1px solid var(--accent);padding-bottom:10px}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:8px;color:var(--muted);font-weight:600}
input,select{width:100%;padding:12px;background:var(--input);border:2px solid var(--accent);border-radius:5px;color:var(--text);font-size:1em}
input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 10px rgba(0,148,255,.4)}
input[readonly]{opacity:.8;border-style:dashed;cursor:not-allowed}
button{background:var(--accent);color:var(--on-accent);border:none;padding:12px 24px;border-radius:5px;font-size:1em;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
button:hover{background:var(--accent2)}
.btn-gray{background:#666;color:#fff}
.btn-gray:hover{background:#808080}
.btn-delete{background:var(--danger);color:#fff;width:auto;margin:0;padding:10px 16px}
.btn-delete:hover{background:#ff6666}
.seg-group{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.seg{flex:1;width:auto;margin:0;background:var(--input);color:var(--text);border:2px solid var(--accent)}
.seg:hover{background:var(--input)}
.seg.active,.seg.active:hover{background:var(--accent);color:var(--on-accent)}
#customersList{display:flex;flex-direction:column;gap:12px}
.customer-item{background:var(--input);border-inline-start:4px solid var(--accent);padding:15px;border-radius:5px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.customer-info{flex:1;min-width:0}
.customer-code{background:var(--accent);color:var(--on-accent);padding:4px 12px;border-radius:20px;font-weight:700;display:inline-block;margin-bottom:8px}
.customer-name{font-size:1.2em;font-weight:700;margin-bottom:5px;word-break:break-word}
.customer-phone{color:var(--muted)}
.no-customers{text-align:center;color:var(--muted);padding:30px;grid-column:1/-1}
.success-message,.error-message{padding:14px;border-radius:5px;margin-bottom:15px;text-align:center}
.success-message{background:var(--ok-bg);border:2px solid var(--ok-bd);color:var(--ok-tx)}
.error-message{background:var(--err-bg);border:2px solid var(--err-bd);color:var(--err-tx)}
.modal-box{max-height:90vh;overflow-y:auto}
.radio-list{display:flex;flex-direction:column;gap:8px}
.radio-item{display:flex;align-items:center;gap:10px;background:var(--input);border:2px solid var(--accent);border-radius:5px;padding:11px 12px;cursor:pointer;margin:0;color:var(--text);font-weight:600}
.radio-item input{width:auto;margin:0;accent-color:var(--accent)}
.radio-item:has(input:checked){background:var(--accent);color:var(--on-accent)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{width:110px;flex-shrink:0;font-size:.9em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;background:var(--input);border-radius:6px;height:18px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:6px;min-width:2px}
.bar-val{width:74px;flex-shrink:0;font-weight:700;text-align:end}
.bar-val small{color:var(--muted);font-weight:400}
#repStats{grid-template-columns:repeat(3,1fr);margin:6px 0 0}
#repStats .stat-box{padding:12px 6px}
#repStats .stat-label{font-size:.85em}
</style>
</head>
<body class="logged-out">

<aside class="sidebar" id="sidebar">
  <div class="brand">📊</div>
  <div class="user-box"><div class="user-name" id="userName"></div><span class="role-badge" id="userRole"></span><div class="sync-status"></div></div>
  <nav>
    <button type="button" class="nav-btn active" data-page="home" data-i18n="navHome"></button>
    <button type="button" class="nav-btn" data-page="add" data-i18n="navAdd"></button>
    <button type="button" class="nav-btn" data-page="list" data-i18n="navList"></button>
    <button type="button" class="nav-btn manager-only" data-page="reports" data-i18n="navReports"></button>
    <button type="button" class="nav-btn manager-only" data-page="accounts" data-i18n="navAccounts"></button>
    <button type="button" class="nav-btn" data-page="settings" data-i18n="navSettings"></button>
    <button type="button" class="nav-btn" id="logoutBtn" style="margin-top:14px" data-i18n="logout"></button>
  </nav>
</aside>
<button type="button" class="sidebar-toggle" id="sidebarToggle"></button>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="brand">📊</div>
    <h2 id="loginTitle"></h2>
    <p class="sub" id="loginSub"></p>
    <div class="sync-status" style="text-align:center;margin:0 0 12px"></div>
    <div class="error-message" id="loginError" hidden></div>
    <div class="form-group"><label for="loginUser" data-i18n="email"></label><input type="email" id="loginUser" autocomplete="username" dir="ltr"></div>
    <div class="form-group"><label for="loginPass" data-i18n="password"></label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <button type="button" id="loginBtn"></button>
    <button type="button" id="forgotBtn" class="btn-gray" data-i18n="forgot"></button>
  </div>
</div>

<div class="container">
  <header><h1 data-i18n="appTitle"></h1></header>
  <div id="messageContainer"></div>

  <!-- الرئيسية -->
  <section class="page active" id="page-home">
    <div class="hero">
      <div class="hero-icon">👋</div>
      <h2 data-i18n="welcomeTitle"></h2>
      <p data-i18n="welcomeText"></p>
      <button type="button" class="hero-btn" data-go="add" data-i18n="startBtn"></button>
    </div>
    <div class="features">
      <div class="feature" data-go="add" role="button" tabindex="0"><div class="f-icon">➕</div><h3 data-i18n="featAddT"></h3><p data-i18n="featAddD"></p></div>
      <div class="feature" data-go="list" role="button" tabindex="0"><div class="f-icon">🔍</div><h3 data-i18n="featListT"></h3><p data-i18n="featListD"></p></div>
      <div class="feature" data-go="add" role="button" tabindex="0"><div class="f-icon">🔢</div><h3 data-i18n="featCodeT"></h3><p data-i18n="featCodeD"></p></div>
      <div class="feature" data-go="settings" role="button" tabindex="0"><div class="f-icon">🎨</div><h3 data-i18n="featSetT"></h3><p data-i18n="featSetD"></p></div>
    </div>
    <div class="stats">
      <div class="stat-box"><div class="stat-number" id="totalCustomers">0</div><div class="stat-label" data-i18n="total"></div></div>
      <div class="stat-box"><div class="stat-number" id="lastCode">-</div><div class="stat-label" data-i18n="lastCode"></div></div>
    </div>
  </section>

  <!-- تسجيل عميل جديد -->
  <section class="page" id="page-add">
    <div class="card">
      <h2 data-i18n="addTitle"></h2>
      <form id="addCustomerForm">
        <div class="form-group">
          <label for="customerCode" data-i18n="codeAuto"></label>
          <input type="text" id="customerCode" readonly>
        </div>
        <div class="form-group">
          <label for="customerName" data-i18n="name"></label>
          <input type="text" id="customerName" required maxlength="80" data-i18n-ph="namePh">
        </div>
        <div class="form-group">
          <label for="customerPhone" data-i18n="phone"></label>
          <input type="tel" id="customerPhone" required pattern="[0-9+\s\-]{7,15}" data-i18n-ph="phonePh" data-i18n-title="phoneTitle">
        </div>
        <div class="form-group"><label data-i18n="sourceLabel"></label><div class="radio-list" id="sourceList"></div></div>
        <button type="submit" data-i18n="addBtn"></button>
      </form>
    </div>
  </section>

  <!-- كل العملاء -->
  <section class="page" id="page-list">
    <div class="card">
      <h2 data-i18n="searchTitle"></h2>
      <div class="form-group">
        <label for="searchCode" data-i18n="code"></label>
        <input type="number" id="searchCode" min="1" data-i18n-ph="searchPh">
      </div>
      <button type="button" id="searchBtn" data-i18n="search"></button>
      <button type="button" id="clearBtn" class="btn-gray" data-i18n="clear"></button>
      <div id="searchResult" style="margin-top:15px"></div>
    </div>
    <div class="card">
      <h2><span data-i18n="listTitle"></span> <span id="listCount"></span></h2>
      <button type="button" id="exportBtn" class="btn-gray manager-only" style="margin:0 0 15px" data-i18n="exportBtn"></button>
      <div id="customersList"></div>
    </div>
  </section>

  <!-- التقارير -->
  <section class="page manager-only" id="page-reports">
    <div class="card">
      <h2 data-i18n="repTitle"></h2>
      <div class="seg-group">
        <button type="button" class="seg" data-period="today" data-i18n="perToday"></button>
        <button type="button" class="seg active" data-period="7" data-i18n="per7"></button>
        <button type="button" class="seg" data-period="30" data-i18n="per30"></button>
        <button type="button" class="seg" data-period="all" data-i18n="perAll"></button>
      </div>
      <div class="stats" id="repStats"></div>
    </div>
    <div class="card"><h2 data-i18n="repBySource"></h2><div id="repSources"></div></div>
    <div class="card"><h2 data-i18n="repByEmp"></h2><div id="repEmployees"></div></div>
    <div class="card" id="repDaysCard"><h2 data-i18n="repByDay"></h2><div id="repDays"></div></div>
  </section>

  <!-- الحسابات -->
  <section class="page manager-only" id="page-accounts">
    <div class="card">
      <h2 data-i18n="accTitle"></h2>
      <form id="addAccountForm">
        <div class="form-group"><label for="accName" data-i18n="accName"></label><input type="text" id="accName" required maxlength="50" autocomplete="off"></div>
        <div class="form-group"><label for="accEmail" data-i18n="email"></label><input type="email" id="accEmail" required autocomplete="off" dir="ltr"></div>
        <div class="form-group"><label for="accPass" data-i18n="password"></label><input type="password" id="accPass" required minlength="6" autocomplete="new-password"></div>
        <div class="form-group"><label for="accRole" data-i18n="role"></label><select id="accRole"><option value="employee" data-i18n="roleEmployee"></option><option value="manager" data-i18n="roleManager"></option></select></div>
        <button type="submit" data-i18n="accAdd"></button>
      </form>
    </div>
    <div class="card">
      <h2 data-i18n="accList"></h2>
      <div id="accountsList"></div>
    </div>
  </section>

  <!-- الإعدادات -->
  <section class="page" id="page-settings">
    <div class="card">
      <h2 data-i18n="settingsTitle"></h2>
      <label data-i18n="theme"></label>
      <div class="seg-group">
        <button type="button" class="seg" data-theme-val="dark" data-i18n="dark"></button>
        <button type="button" class="seg" data-theme-val="light" data-i18n="light"></button>
      </div>
      <label data-i18n="language"></label>
      <div class="seg-group">
        <button type="button" class="seg" data-lang-val="ar">العربية</button>
        <button type="button" class="seg" data-lang-val="en">English</button>
      </div>
      <div class="manager-only"><label data-i18n="numbering"></label>
      <button type="button" id="resetBtn" class="btn-gray" style="margin-top:0" data-i18n="reset"></button>
      <label style="margin-top:22px" data-i18n="security"></label>
      <button type="button" id="changePwBtn" class="btn-gray" style="margin-top:0" data-i18n="changePw"></button></div>
      <div class="manager-only" style="margin-top:22px">
        <label data-i18n="sheetLabel"></label>
        <input type="url" id="sheetUrl" dir="ltr" data-i18n-ph="sheetPh">
        <button type="button" id="sheetSave" class="btn-gray" data-i18n="save"></button>
        <button type="button" id="sheetSendAll" class="btn-gray" data-i18n="sheetSendAll"></button>
      </div>
    </div>
  </section>
</div>

<div class="modal" id="pwModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
    <h3 id="pwTitle"></h3>
    <p id="pwHint"></p>
    <div class="form-group" id="pwF1"><label for="pw1" id="pw1L"></label><input type="password" id="pw1" autocomplete="off"></div>

    <div class="modal-actions">
      <button type="button" id="pwOk" data-i18n="pwOk"></button>
      <button type="button" id="pwCancel" class="btn-gray" data-i18n="pwCancel"></button>
    </div>
  </div>
</div>

<div class="modal" id="dupModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <h3 data-i18n="dupTitle"></h3>
    <p data-i18n="dupText"></p>
    <div id="dupList"></div>
    <div class="modal-actions">
      <button type="button" id="dupAdd" data-i18n="dupAdd"></button>
      <button type="button" id="dupCancel" class="btn-gray" data-i18n="dupCancel"></button>
    </div>
  </div>
</div>

<div class="modal" id="formModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="fmTitle">
    <h3 id="fmTitle"></h3>
    <div class="form-group"><label for="fm1" id="fm1L"></label><input type="text" id="fm1" autocomplete="off"></div>
    <div class="form-group" id="fmF2"><label for="fm2" id="fm2L"></label><input type="text" id="fm2" autocomplete="off"></div>
    <div class="error-message" id="fmError" hidden></div>
    <div class="modal-actions">
      <button type="button" id="fmOk" data-i18n="save"></button>
      <button type="button" id="fmCancel" class="btn-gray" data-i18n="pwCancel"></button>
    </div>
  </div>
</div>

  get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] ?? null; } },
  set(k, v) { mem[k] = v; try { localStorage.setItem(k, String(v)); } catch (e) {} }
};

const SOURCES = [
  { k: 'whatsapp', i: 'srcWhatsapp' }, { k: 'page', i: 'srcPage' }, { k: 'account', i: 'srcAccount' },
  { k: 'tiktok', i: 'srcTiktok' }, { k: 'training', i: 'srcTraining' }, { k: 'trousers', i: 'srcTrousers' }
];
function srcLabel(k, l) {
  const s = SOURCES.find(x => x.k === k);
  return s ? I18N[l || lang][s.i] : (k || '');
}
function renderSources() {
  const box = $('sourceList');
  const cur = box.querySelector('input:checked');
  const keep = cur ? cur.value : '';
  box.innerHTML = SOURCES.map((s, i) =>
    '<label class="radio-item"><input type="radio" name="source" value="' + s.k + '"' + (i === 0 ? ' required' : '') + (s.k === keep ? ' checked' : '') + '><span>' + t(s.i) + '</span></label>'
  ).join('');
}
function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* ---------- واجهة عامة ---------- */
function showMessage(text, type) {
  $('messageContainer').innerHTML = '<div class="' + (type === 'success' ? 'success-message' : 'error-message') + '">' + text + '</div>';
  setTimeout(() => { $('messageContainer').innerHTML = ''; }, 3500);
}

function loginNote(text, ok) {
  const el = $('loginError');
  el.textContent = text || '';
  el.className = ok ? 'success-message' : 'error-message';
  el.hidden = !text;
}

function authMsg(e) {
  const c = (e && e.code) || '';
  if (c.includes('email-already-in-use')) return t('errExists');
  if (c.includes('weak-password')) return t('pwShort');
  if (c.includes('invalid-email')) return t('errEmail');
  if (c.includes('network')) return t('errNet');
  if (c.includes('too-many-requests')) return t('errMany');
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-login')) return t('errLogin');
  return t('msgSyncFail');
}

function customerHTML(c, withActions) {
  const code = esc(String(c.code));
  return '<div class="customer-item"><div class="customer-info">' +
    '<div class="customer-code">' + t('codeLabel') + code + '</div>' +
    '<div class="customer-name">👤 ' + esc(c.name) + '</div>' +
    '<div class="customer-phone">📞 ' + esc(c.phone) + '</div>' +
    (c.source ? '<div class="customer-phone">📣 ' + esc(srcLabel(c.source)) + '</div>' : '') + '</div>' +
    (withActions ? '<div class="acc-actions manager-only"><button type="button" class="btn-edit" data-code="' + code + '">' + t('edit') + '</button><button type="button" class="btn-delete" data-code="' + code + '">' + t('del') + '</button></div>' : '') +
    '</div>';
}

function lastCode() {
  return Math.max(counter, customers.reduce((m, c) => Math.max(m, Number(c.code) || 0), 0));
}

function refresh() {
  const last = lastCode();
  $('totalCustomers').textContent = customers.length;
  $('lastCode').textContent = last > 0 ? last : '-';
  $('customerCode').value = last + 1;
  $('listCount').textContent = '(' + customers.length + ')';
  $('customersList').innerHTML = customers.length === 0
    ? '<div class="no-customers">' + t('empty') + '</div>'
    : [...customers].sort((a, b) => Number(b.code) - Number(a.code)).map(c => customerHTML(c, true)).join('');
  renderReports();
}

function renderAccounts() {
  const box = $('accountsList');
  if (!box) return;
  box.innerHTML = [...users].sort((a, b) => String(a.name).localeCompare(String(b.name))).map(a => {
    const self = !!me && a.uid === me.uid;
    const uid = esc(a.uid);
    return '<div class="customer-item acc-item"><div class="customer-info">' +
      '<div class="customer-name">👤 ' + esc(a.name || '') + '</div>' +
      '<div class="customer-phone" dir="ltr" style="text-align:start">' + esc(a.email || '') + '</div>' +
      '<div class="customer-phone"><span class="role-badge">' + t(a.role === 'manager' ? 'roleManager' : 'roleEmployee') + '</span> ' +
      (a.active ? '🟢 ' + t('statusActive') : '⛔ ' + t('statusOff')) + '</div></div>' +
      '<div class="acc-actions">' +
      '<button type="button" data-uid="' + uid + '" data-act="edit">' + t('edit') + '</button>' +
      '<button type="button" data-uid="' + uid + '" data-act="mail">' + t('resetMail') + '</button>' +
      (self ? '' : '<button type="button" class="btn-warn" data-uid="' + uid + '" data-act="toggle">' + t(a.active ? 'suspend' : 'activate') + '</button>' +
        '<button type="button" class="btn-delete" data-uid="' + uid + '" data-act="del">' + t('del') + '</button>') +
      '</div></div>';
  }).join('');
}

function renderLogin() {
  const setup = ready && setupDone === false;
  $('loginTitle').textContent = t(setup ? 'setupTitle' : 'loginTitle');
  $('loginSub').textContent = !CONFIGURED ? t('cfgMissing') : (!ready ? t('syncLoading') : t(setup ? 'setupSub' : 'loginSub'));
  $('loginBtn').textContent = t(setup ? 'setupBtn' : 'loginBtn');
  $('loginBtn').disabled = !CONFIGURED || !ready;
  $('forgotBtn').hidden = setup || !ready;
  $('loginPass').autocomplete = setup ? 'new-password' : 'current-password';
}

function updateSync() {
  const txt = navigator.onLine ? t('syncOn') : t('offline');
  document.querySelectorAll('.sync-status').forEach(el => { el.textContent = txt; });
}

function applySession() {
  const loggedIn = !!me;
  document.body.classList.toggle('logged-out', !loggedIn);
  document.body.classList.toggle('is-manager', isManager());
  if (loggedIn) {
    $('userName').textContent = me.name || me.email;
    $('userRole').textContent = t(isManager() ? 'roleManager' : 'roleEmployee');
    if (!isManager() && currentPage === 'accounts') showPage('home');
  }
  renderLogin();
  renderAccounts();
  refresh();
  updateSync();
}

let reportPeriod = '7';
function barRows(items, total) {
  if (!items.length) return '<div class="no-customers">' + t('noData') + '</div>';
  const max = Math.max(1, ...items.map(i => i.count));
  return items.map(i => '<div class="bar-row"><div class="bar-label">' + esc(i.label) + '</div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' + (i.count / max * 100) + '%"></div></div>' +
    '<div class="bar-val">' + i.count + (total ? ' <small>(' + Math.round(i.count / total * 100) + '%)</small>' : '') + '</div></div>').join('');
}
function renderReports() {
  if (currentPage !== 'reports' || !isManager()) return;
  const keyOf = iso => fmtDate(iso).slice(0, 10);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const todayKey = keyOf(today.toISOString());
  let from = null;
  if (reportPeriod === 'today') from = today;
  else if (reportPeriod === '7' || reportPeriod === '30') { from = new Date(today); from.setDate(from.getDate() - (reportPeriod === '7' ? 6 : 29)); }
  const list = customers.filter(c => {
    if (!from) return true;
    const d = c.createdAt ? new Date(c.createdAt) : null;
    return !!d && !isNaN(d) && d >= from;
  });
  const todayCount = customers.filter(c => c.createdAt && keyOf(c.createdAt) === todayKey).length;
  const box = (n, label) => '<div class="stat-box"><div class="stat-number">' + n + '</div><div class="stat-label">' + label + '</div></div>';
  $('repStats').innerHTML = box(list.length, t('repPeriodTotal')) + box(todayCount, t('repToday')) + box(customers.length, t('repAllTotal'));

  const sc = {};
  list.forEach(c => { const k = SOURCES.some(s => s.k === c.source) ? c.source : 'other'; sc[k] = (sc[k] || 0) + 1; });
  const srcItems = SOURCES.map(s => ({ label: t(s.i), count: sc[s.k] || 0 }))
    .concat(sc.other ? [{ label: t('unknown'), count: sc.other }] : [])
    .sort((a, b) => b.count - a.count);
  $('repSources').innerHTML = barRows(srcItems, list.length);

  const ec = {};
  list.forEach(c => { const k = c.createdBy || t('unknown'); ec[k] = (ec[k] || 0) + 1; });
  const empItems = Object.keys(ec).map(k => ({ label: k, count: ec[k] })).sort((a, b) => b.count - a.count);
  $('repEmployees').innerHTML = barRows(empItems, list.length);

  $('repDaysCard').hidden = reportPeriod === 'today';
  const n = reportPeriod === '7' ? 7 : 30;
  const dc = {};
  customers.forEach(c => { if (c.createdAt) { const k = keyOf(c.createdAt); dc[k] = (dc[k] || 0) + 1; } });
  const dayItems = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const k = keyOf(d.toISOString());
    dayItems.push({ label: k.slice(5), count: dc[k] || 0 });
  }
  $('repDays').innerHTML = barRows(dayItems, 0);
}

// كود متسلسل مضمون حتى لو أكتر من موظف بيضيف في نفس اللحظة (Transaction)
async function addCustomer(name, phone, source) {
  const cRef = doc(db, 'meta', 'counter');
  const createdAt = new Date().toISOString();
  const createdBy = (me && (me.name || me.email)) || '';
  return runTransaction(db, async tx => {
    const snap = await tx.get(cRef);
    const next = (snap.exists() ? Number(snap.data().value) || 0 : 0) + 1;
    const rec = { code: next, name: name, phone: phone, source: source, createdAt: createdAt, createdBy: createdBy };
    tx.set(cRef, { value: next });
    tx.set(doc(db, 'customers', String(next)), rec);
    return rec;
  });
}

/* ---------- منع التكرار ---------- */
function normName(s) {
  return String(s || '').toLowerCase()
    .replace(/[\u064B-\u0652\u0640]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/\s+/g, ' ').trim();
}
function normPhone(s) {
  let d = String(s || '').replace(/[٠-٩]/g, x => '٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g, '');
  if (d.startsWith('0020')) d = d.slice(4);
  else if (d.startsWith('20') && d.length >= 12) d = d.slice(2);
  if (d.length === 10 && d[0] !== '0') d = '0' + d;
  return d;
}
function findDuplicates(name, phone) {
  const n = normName(name);
  const p = normPhone(phone);
  const out = [];
  customers.forEach(c => {
    const nameMatch = !!n && normName(c.name) === n;
    const phoneMatch = !!p && normPhone(c.phone) === p;
    if (nameMatch || phoneMatch) out.push({ c: c, nameMatch: nameMatch, phoneMatch: phoneMatch });
  });
  return out.slice(0, 5);
}
let dupResolve = null;
function confirmDup(matches) {
  $('dupList').innerHTML = matches.map(m =>
    '<div style="margin-bottom:10px">' +
    (m.nameMatch ? '<span class="role-badge">' + t('dupSameName') + '</span> ' : '') +
    (m.phoneMatch ? '<span class="role-badge">' + t('dupSamePhone') + '</span>' : '') +
    customerHTML(m.c, false) + '</div>'
  ).join('');
  $('dupModal').hidden = false;
  return new Promise(res => { dupResolve = res; });
}
function closeDup(r) {
  $('dupModal').hidden = true;
  if (dupResolve) { dupResolve(r); dupResolve = null; }
}

/* ---------- Excel / Google Sheet ---------- */
function sheetRow(c) {
  return { code: c.code, name: c.name, phone: c.phone, source: srcLabel(c.source, 'ar'), date: c.createdAt ? fmtDate(c.createdAt) : '', by: c.createdBy || '' };
}
function sheetPost(rows) {
  if (!sheetUrl || !rows.length) return;
  try {
    fetch(sheetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(rows.length === 1 ? rows[0] : { rows: rows }) }).catch(() => {});
  } catch (e) {}
}
function sortedCustomers() { return [...customers].sort((a, b) => Number(a.code) - Number(b.code)); }
function exportExcel() {
  const head = [t('colCode'), t('colName'), t('colPhone'), t('colSource'), t('colDate'), t('colBy')];
  const data = [head].concat(sortedCustomers().map(c => [c.code, c.name, c.phone, srcLabel(c.source), c.createdAt ? fmtDate(c.createdAt) : '', c.createdBy || '']));
  if (window.XLSX) {
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{ wch: 8 }, { wch: 28 }, { wch: 16 }, { wch: 18 }, { wch: 18 }, { wch: 18 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Customers');
    XLSX.writeFile(wb, 'customers.xlsx');
  } else {
    const csv = '\ufeff' + data.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'customers.csv';
    a.click();
  }
  showMessage(t('msgExported'), 'success');
}

    validate: (a, b) => (!a || !/^[0-9+ -]{7,15}$/.test(b.trim())) ? t('msgFill') : ''
  });
  if (!r) return;
  try {
    await updateDoc(doc(db, 'customers', String(code)), { name: r.v1, phone: r.v2.trim() });
    showMessage(t('msgCustUpdated'), 'success');

}

async function renumber() {
  const sorted = [...customers].sort((a, b) => Number(a.code) - Number(b.code));
  const ops = [];
  const keep = new Set();
  sorted.forEach((c, i) => {
    const code = i + 1;
    keep.add(String(code));
    ops.push(b => b.set(doc(db, 'customers', String(code)), { code: code, name: c.name, phone: c.phone }));
  });
  customers.forEach(c => {
    const k = String(c.code);
    if (!keep.has(k)) ops.push(b => b.delete(doc(db, 'customers', k)));
  });
  ops.push(b => b.set(doc(db, 'meta', 'counter'), { value: sorted.length }));
  for (let i = 0; i < ops.length; i += 400) {
    const b = writeBatch(db);
    ops.slice(i, i + 400).forEach(f => f(b));
    await b.commit();
  }
  return sorted.length;
}

function stopAll() {

  unsubs = [];

  customers = []; users = []; counter = 0; me = null;
}
function startUsers() {
  unsubs.push(onSnapshot(collection(db, 'users'), s => {
    users = s.docs.map(d => ({ uid: d.id, ...d.data() }));
    renderAccounts();
  }, () => {}));
}
function startData() {
  unsubs.push(onSnapshot(collection(db, 'customers'), s => {
    customers = s.docs.map(d => ({ ...d.data() }));
    refresh();
  }, () => {}));
  unsubs.push(onSnapshot(doc(db, 'meta', 'counter'), s => {
    counter = s.exists() ? (Number(s.data().value) || 0) : 0;
    refresh();
  }, () => {}));
  unsubs.push(onSnapshot(doc(db, 'meta', 'settings'), s => {
    sheetUrl = s.exists() ? (s.data().sheetUrl || '') : '';
    const el = $('sheetUrl');
    if (document.activeElement !== el) el.value = sheetUrl;
  }, () => {}));
  if (isManager()) startUsers();
}

function watchAuth() {
  onAuthStateChanged(auth, user => {
    stopAll();
    if (!user) { ready = true; applySession(); return; }
    unsubMe = onSnapshot(doc(db, 'users', user.uid), snap => {
      ready = true;
      if (!snap.exists()) {
        if (!bootstrapping) { loginNote(t('accDeleted')); signOut(auth); }
        return;
      }
      const d = snap.data();
      if (d.active !== true) { loginNote(t('errDisabled')); signOut(auth); return; }
      const first = !me;
      const wasManager = isManager();
      me = { uid: user.uid, ...d };
      if (first) startData();
      else if (isManager() && !wasManager) startUsers();
      applySession();
    }, () => { ready = true; applySession(); });
  });
}

async function doLogin() {
  const email = $('loginUser').value.trim();
  const pass = $('loginPass').value;
  loginNote('');
  if (!email || pass.length < 6) { loginNote(t('msgFillAcc')); return; }
  $('loginBtn').disabled = true;
  try {
    if (setupDone === false) {
      bootstrapping = true;
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      try {
        const b = writeBatch(db);
        b.set(doc(db, 'users', cred.user.uid), { name: email.split('@')[0], email: email, role: 'manager', active: true });
        b.set(doc(db, 'meta', 'setup'), { done: true, by: cred.user.uid });
        await b.commit();
        setupDone = true;
      } catch (e2) {
        try { await cred.user.delete(); } catch (e3) {}
        throw e2;
      }
    } else {
      await signInWithEmailAndPassword(auth, email, pass);
    }
    $('loginPass').value = '';
  } catch (e) { loginNote(authMsg(e)); }
  bootstrapping = false;
  $('loginBtn').disabled = !ready;
}

      showMessage(t('msgResetMail').replace('{e}', acc.email), 'success');
    } else if (act === 'edit') {
      const r = await openFormModal({
        title: t('editAccTitle'), l1: t('accName'), v1: acc.name || '', single: true,
        validate: v => v ? '' : t('msgFillAcc')
      });
      if (!r) return;
      await updateDoc(doc(db, 'users', acc.uid), { name: r.v1 });
      showMessage(t('msgAccUpdated'), 'success');
    }
  } catch (err) { showMessage(authMsg(err), 'error'); }
});

/* ---------- التشغيل ---------- */
async function init() {
  applyTheme();
  applyLang();
  if (!CONFIGURED) return;
  try {
    app = initializeApp(firebaseConfig);
    auth = getAuth(app);
    db = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
  } catch (e) { return; }
  try { setupDone = (await getDoc(doc(db, 'meta', 'setup'))).exists(); } catch (e) { setupDone = true; }
  watchAuth();
}
init();

</script>
